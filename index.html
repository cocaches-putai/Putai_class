<html lang="zh-Hant">
<head>

<title>普台高級中學 課表查詢系統</title>
<style>
:root{
  --bg:#F8F4EC; --surface:#FFFFFF; --surface-2:#F1EAD9; --border:#E1D6BC;
  --text:#2A2620; --text-2:#6F6555;
  --accent:#2F5D57; --accent-strong:#1F433F; --accent-contrast:#FFFFFF; --accent-bg:#E3ECE9;
  --warn:#B5651D; --warn-bg:#FBEEDF;
  --good:#3E7A4E; --good-bg:#EAF3EC;
  --grp-a:#5A6C9C; --grp-a-bg:#E7EAF6;
  --grp-b:#4C7A6B; --grp-b-bg:#E4EFEA;
  --grp-c:#9C5A6C; --grp-c-bg:#F6E7EC;
  --shadow:0 1px 2px rgba(42,38,32,.06), 0 4px 14px rgba(42,38,32,.06);
  --font-display:'Noto Serif TC','PMingLiU',serif;
  --font-body:'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1C1914; --surface:#26221B; --surface-2:#2E2820; --border:#463D2E;
    --text:#ECE5D6; --text-2:#B2A78E;
    --accent:#72B9AB; --accent-strong:#93CFC2; --accent-contrast:#123029; --accent-bg:#213330;
    --warn:#E3954E; --warn-bg:#3B2A17;
    --good:#82C391; --good-bg:#1E2E20;
    --grp-a:#909FDA; --grp-a-bg:#252B44;
    --grp-b:#83B7A5; --grp-b-bg:#22322B;
    --grp-c:#D68CA0; --grp-c-bg:#3A2530;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#1C1914; --surface:#26221B; --surface-2:#2E2820; --border:#463D2E;
  --text:#ECE5D6; --text-2:#B2A78E;
  --accent:#72B9AB; --accent-strong:#93CFC2; --accent-contrast:#123029; --accent-bg:#213330;
  --warn:#E3954E; --warn-bg:#3B2A17;
  --good:#82C391; --good-bg:#1E2E20;
  --grp-a:#909FDA; --grp-a-bg:#252B44;
  --grp-b:#83B7A5; --grp-b-bg:#22322B;
  --grp-c:#D68CA0; --grp-c-bg:#3A2530;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.35);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg); color:var(--text); font-family:var(--font-body);
  font-size:15px; line-height:1.6; -webkit-font-smoothing:antialiased;
}
#app{max-width:1080px;margin:0 auto;padding:22px 16px 70px;}
h1,h2,h3{font-family:var(--font-display);font-weight:700;margin:0;}
.eyebrow{font-size:12px;letter-spacing:.08em;color:var(--text-2);font-weight:600;}
header.page-head{margin-bottom:18px;}
header.page-head h1{font-size:24px;color:var(--accent-strong);margin-top:4px;}
header.page-head p{color:var(--text-2);margin:8px 0 0;font-size:13px;max-width:70ch;}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);padding:18px;}
.stack{display:flex;flex-direction:column;gap:14px;}
.mode-row{display:flex;gap:8px;margin-bottom:14px;}
.mode-btn{
  flex:1;border:1px solid var(--border);background:var(--surface-2);color:var(--text);
  border-radius:10px;padding:10px 14px;font-weight:700;cursor:pointer;font-size:14px;font-family:var(--font-body);
}
.mode-btn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-contrast);}
.field-label{display:block;font-size:12.5px;font-weight:600;color:var(--text-2);margin-bottom:6px;letter-spacing:.02em;}
.daychip-row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;}
.chip-btn{
  border:1px solid var(--border);background:var(--surface-2);color:var(--text);
  border-radius:999px;padding:6px 13px;cursor:pointer;font-weight:600;font-size:13px;font-family:var(--font-body);
}
.chip-btn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-contrast);}
select{
  appearance:none;background:var(--surface-2);color:var(--text);
  border:1px solid var(--border);border-radius:9px;padding:9px 32px 9px 12px;
  min-width:220px;max-width:100%;cursor:pointer;font-size:14px;font-family:var(--font-body);
  background-image:linear-gradient(45deg,transparent 50%,var(--text-2) 50%),linear-gradient(135deg,var(--text-2) 50%,transparent 50%);
  background-position:calc(100% - 16px) 15px, calc(100% - 11px) 15px; background-size:5px 5px; background-repeat:no-repeat;
}
.badge{display:inline-flex;align-items:center;gap:4px;border-radius:7px;padding:3px 9px;font-size:11.5px;font-weight:700;white-space:nowrap;}
.badge-a{background:var(--grp-a-bg);color:var(--grp-a);}
.badge-b{background:var(--grp-b-bg);color:var(--grp-b);}
.badge-c{background:var(--grp-c-bg);color:var(--grp-c);}
.badge-neutral{background:var(--surface-2);color:var(--text-2);}
.teacher-meta{margin-top:10px;padding-top:10px;border-top:1px dashed var(--border);font-size:13px;color:var(--text-2);}
.week-section{margin-top:22px;}
.week-title{font-size:15px;font-weight:700;font-family:var(--font-display);color:var(--accent-strong);margin:0 0 8px;display:flex;align-items:center;gap:8px;}
.scroll-x{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--border);border-radius:12px;}
table.sched{width:100%;border-collapse:collapse;min-width:620px;background:var(--surface);}
table.sched th, table.sched td{border-bottom:1px solid var(--border);border-right:1px solid var(--border);padding:8px 6px;text-align:center;vertical-align:middle;}
table.sched th:last-child, table.sched td:last-child{border-right:none;}
table.sched thead th{background:var(--surface-2);color:var(--text-2);font-size:12.5px;font-weight:700;padding:9px 6px;position:sticky;top:0;}
table.sched th.period-col, table.sched td.period-col{
  background:var(--surface-2);color:var(--text-2);font-weight:700;font-size:12px;white-space:nowrap;min-width:64px;
}
table.sched td.cell-slot{min-width:84px;font-size:12.5px;}
table.sched td.cell-empty{color:var(--text-2);opacity:.45;}
.cell-main{font-weight:700;font-size:13px;}
.cell-sub{color:var(--text-2);font-size:11.5px;margin-top:1px;}
.cell-link{background:none;border:none;padding:0;color:var(--accent-strong);font-weight:700;font-size:13px;cursor:pointer;text-decoration:underline;font-family:var(--font-body);}
.cell-link:hover{color:var(--accent);}
.multi-entry{border-top:1px dashed var(--border);margin-top:3px;padding-top:3px;}
.empty-state{color:var(--text-2);font-size:13.5px;padding:30px 4px;text-align:center;}
.footnote{margin-top:26px;font-size:12px;color:var(--text-2);line-height:1.7;border-top:1px solid var(--border);padding-top:14px;}
.footnote code{background:var(--surface-2);padding:1px 5px;border-radius:4px;}
.hint-swipe{font-size:12px;color:var(--text-2);margin:4px 0 0;}
@media (max-width:600px){
  header.page-head h1{font-size:20px;}
  .mode-btn{font-size:13px;padding:9px 10px;}
}
</style>
</head>

<script>
(function(){
  'use strict';
  var TEACHERS = JSON.parse(document.getElementById('teachers-data').textContent);
  var CLASSES = JSON.parse(document.getElementById('classes-data').textContent);
  var META = JSON.parse(document.getElementById('meta-data').textContent);

  var NONJK_DAYS = ['一','二','三','四','五','六','日'];
  var JK_DAYS = ['一','二','三','四','五'];
  var PERIODS = [{key:'早自習',label:'早自習'},{key:'1',label:'第1節'},{key:'2',label:'第2節'},{key:'3',label:'第3節'},{key:'4',label:'第4節'},{key:'5',label:'第5節'},{key:'6',label:'第6節'},{key:'7',label:'第7節'},{key:'8',label:'第8節'}];

  var CLASS_RE = /^((國|高)[一二三](?!年|彈性)|(7|8|9|10|11|12)(EA|EB|MA|MB)\d|(7|8|9|10|11|12)08)/;
  function isHomeroomMeeting(subj){
    var s = (subj||'').replace(/[.．。]+$/,'');
    return s==='班會';
  }
  function isRealClass(cls, subj){
    return cls && CLASS_RE.test(cls) && !isHomeroomMeeting(subj) && !/彈性$/.test(cls);
  }

  var INTL_TEACHER_NAMES = {'張少芹':1,'吳旻娟':1,'陳廣方':1,'馮詩栴':1,'林宗民':1,'吳青樺':1,'曾郁升':1,'蔡如恩':1,'Jason':1,'廖學儒':1,'Lawrence':1,'Ivyway(Andrew)':1,'Ryanna':1,'李麗秋':1,'Andrew':1,'Michael':1,'Burger':1,'Jovelle':1,'Alex':1,'John':1,'譚寶璇':1};
  var TEACHER_CATEGORY_ORDER = ['國文','英文','數學','自然科','社會科','藝能科','二外','生命課','國際部'];
  var TEACHER_CATEGORY_SUBJECTS = [
    {name:'國文', subjects:['國文','書法','國學、本土語、硬筆字']},
    {name:'英文', subjects:['英文']},
    {name:'數學', subjects:['數學']},
    {name:'自然科', subjects:['物理','化學','生物','地球科學','理化']},
    {name:'社會科', subjects:['歷史','地理','公民','社會']},
    {name:'藝能科', subjects:['音樂','美術','體育','生活科技、童軍','表演藝術','資訊','資訊、生活科技','輔導','健康、護理','國防','家政','研究法']},
    {name:'二外', subjects:['日語','西語','法語']},
    {name:'生命課', subjects:['靜心教育','生命教育']}
  ];
  function teacherCategory(t){
    if(INTL_TEACHER_NAMES[t.name]) return '國際部';
    for(var i=0;i<TEACHER_CATEGORY_SUBJECTS.length;i++){
      if(TEACHER_CATEGORY_SUBJECTS[i].subjects.indexOf(t.subject)!==-1) return TEACHER_CATEGORY_SUBJECTS[i].name;
    }
    return '藝能科';
  }

  var CLASS_GROUP_ORDER = ['高中班級','國中班級','分組選修代碼'];

  function findTeacher(name){
    for(var i=0;i<TEACHERS.length;i++){ if(TEACHERS[i].name===name) return TEACHERS[i]; }
    return null;
  }

  // class -> weekType -> day-period -> [{teacher, subject}]  (computed on the fly from teacher grids, same source of truth)
  function classSlotsFor(className){
    var out = {'非淨空週':{}, '淨空週':{}};
    for(var i=0;i<TEACHERS.length;i++){
      var t = TEACHERS[i];
      ['非淨空週','淨空週'].forEach(function(wt){
        var days = t.grid[wt]; if(!days) return;
        Object.keys(days).forEach(function(key){
          var cell = days[key];
          if(cell && cell.class===className){
            if(!out[wt][key]) out[wt][key] = [];
            out[wt][key].push({teacher:t.name, subject:cell.subject});
          }
        });
      });
    }
    return out;
  }

  var uiState = {mode:'class', className:null, teacherName:null, classGroupFilter:'', teacherCategoryFilter:''};

  function esc(s){
    return String(s==null?'':s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  function groupBadgeClass(g){
    if(g==='國英數') return 'badge-a';
    if(g==='自與社') return 'badge-b';
    if(g==='藝能科') return 'badge-c';
    return 'badge-neutral';
  }

  function chipsRow(options, selected, action){
    var all = '<button type="button" class="chip-btn" data-action="'+action+'" data-val="" aria-pressed="'+(!selected?'true':'false')+'">不限</button>';
    var rest = options.map(function(o){
      var pressed = selected===o.val;
      return '<button type="button" class="chip-btn" data-action="'+action+'" data-val="'+esc(o.val)+'" aria-pressed="'+(pressed?'true':'false')+'">'+esc(o.label)+'</button>';
    }).join('');
    return all+rest;
  }

  function renderModeSwitch(){
    return '<div class="mode-row">'+
      '<button type="button" class="mode-btn" data-action="set-mode" data-mode="class" aria-pressed="'+(uiState.mode==='class'?'true':'false')+'">依班級查詢</button>'+
      '<button type="button" class="mode-btn" data-action="set-mode" data-mode="teacher" aria-pressed="'+(uiState.mode==='teacher'?'true':'false')+'">依教師查詢</button>'+
    '</div>';
  }

  function renderClassPicker(){
    var filter = uiState.classGroupFilter;
    var groupOpts = CLASS_GROUP_ORDER.map(function(g){ return {val:g, label:g}; });
    var pool = filter ? CLASSES.filter(function(c){ return c.group===filter; }) : CLASSES;
    var opts = pool.map(function(c){
      var sel = c.name===uiState.className ? ' selected' : '';
      return '<option value="'+esc(c.name)+'"'+sel+'>'+esc(c.name)+'</option>';
    }).join('');
    return '<div class="field-label">先選類別（可跳過）</div>'+
      '<div class="daychip-row">'+chipsRow(groupOpts, filter, 'class-group-filter')+'</div>'+
      '<div class="field-label" for="class-select">選擇班級／分組代碼（共 '+pool.length+' 個）</div>'+
      '<select id="class-select" data-action="select-class">'+
        '<option value="">— 請選擇 —</option>'+opts+
      '</select>';
  }

  function renderTeacherPicker(){
    var cat = uiState.teacherCategoryFilter;
    var catOpts = TEACHER_CATEGORY_ORDER.map(function(c){ return {val:c, label:c}; });
    var pool = cat ? TEACHERS.filter(function(t){ return teacherCategory(t)===cat; }) : TEACHERS;
    var sorted = pool.slice().sort(function(a,b){
      if(a.group!==b.group) return a.group.localeCompare(b.group,'zh-Hant');
      if(a.subject!==b.subject) return a.subject.localeCompare(b.subject,'zh-Hant');
      return a.name.localeCompare(b.name,'zh-Hant');
    });
    var opts = sorted.map(function(t){
      var sel = t.name===uiState.teacherName ? ' selected' : '';
      return '<option value="'+esc(t.name)+'"'+sel+'>'+esc(t.name)+'（'+esc(t.subject)+'）</option>';
    }).join('');
    return '<div class="field-label">先選科目分類（可跳過）</div>'+
      '<div class="daychip-row">'+chipsRow(catOpts, cat, 'teacher-category-filter')+'</div>'+
      '<div class="field-label" for="teacher-select">選擇老師（共 '+sorted.length+' 位）</div>'+
      '<select id="teacher-select" data-action="select-teacher">'+
        '<option value="">— 請選擇 —</option>'+opts+
      '</select>';
  }

  function cellHtmlForClassView(entries){
    if(!entries || entries.length===0) return '<td class="cell-slot cell-empty">—</td>';
    var parts = entries.map(function(e, idx){
      var cls = idx>0 ? ' multi-entry' : '';
      var linkable = !!findTeacher(e.teacher);
      var nameHtml = linkable
        ? '<button type="button" class="cell-link" data-action="goto-teacher" data-name="'+esc(e.teacher)+'">'+esc(e.teacher)+'</button>'
        : '<span class="cell-main">'+esc(e.teacher)+'</span>';
      return '<div class="'+cls.trim()+'"><div class="cell-main">'+nameHtml+'</div><div class="cell-sub">'+esc(e.subject||'')+'</div></div>';
    }).join('');
    return '<td class="cell-slot">'+parts+'</td>';
  }

  function cellHtmlForTeacherView(cell){
    if(!cell || !cell.class) return '<td class="cell-slot cell-empty">空堂</td>';
    var cls = cell.class, subj = cell.subject||'';
    var linkable = isRealClass(cls, subj) && CLASSES.some(function(c){ return c.name===cls; });
    var clsHtml = linkable
      ? '<button type="button" class="cell-link" data-action="goto-class" data-name="'+esc(cls)+'">'+esc(cls)+'</button>'
      : '<span class="cell-main">'+esc(cls)+'</span>';
    return '<td class="cell-slot"><div class="cell-main">'+clsHtml+'</div><div class="cell-sub">'+esc(subj)+'</div></td>';
  }

  function renderWeekTable(weekType, days, rowRenderer){
    var head = '<tr><th class="period-col">節次</th>'+days.map(function(d){ return '<th>週'+esc(d)+'</th>'; }).join('')+'</tr>';
    var rows = PERIODS.map(function(p){
      var tds = days.map(function(d){ return rowRenderer(d, p.key); }).join('');
      return '<tr><td class="period-col">'+esc(p.label)+'</td>'+tds+'</tr>';
    }).join('');
    return '<div class="week-section">'+
      '<div class="week-title">'+esc(weekType)+(weekType==='淨空週' ? ' <span class="badge badge-neutral" style="font-weight:600;">週五提早放學，週六日無課</span>' : '')+'</div>'+
      '<p class="hint-swipe">手機可左右滑動查看整週課表</p>'+
      '<div class="scroll-x"><table class="sched"><thead>'+head+'</thead><tbody>'+rows+'</tbody></table></div>'+
    '</div>';
  }

  function renderClassSchedule(){
    if(!uiState.className) return '<div class="empty-state">請先選擇一個班級／分組代碼</div>';
    var slots = classSlotsFor(uiState.className);
    var t1 = renderWeekTable('非淨空週', NONJK_DAYS, function(d,p){
      return cellHtmlForClassView(slots['非淨空週'][d+'-'+p]);
    });
    var t2 = renderWeekTable('淨空週', JK_DAYS, function(d,p){
      return cellHtmlForClassView(slots['淨空週'][d+'-'+p]);
    });
    return t1+t2;
  }

  function renderTeacherSchedule(){
    if(!uiState.teacherName) return '<div class="empty-state">請先選擇一位老師</div>';
    var t = findTeacher(uiState.teacherName);
    if(!t) return '<div class="empty-state">查無此老師</div>';
    var meta = '<div class="teacher-meta"><span class="badge '+groupBadgeClass(t.group)+'">'+esc(t.subject)+'</span>　'+esc(t.role||'')+'</div>';
    var t1 = renderWeekTable('非淨空週', NONJK_DAYS, function(d,p){
      return cellHtmlForTeacherView(t.grid['非淨空週'][d+'-'+p]);
    });
    var t2 = renderWeekTable('淨空週', JK_DAYS, function(d,p){
      return cellHtmlForTeacherView(t.grid['淨空週'][d+'-'+p]);
    });
    return meta+t1+t2;
  }

  function render(){
    var app = document.getElementById('app');
    var pickerHtml = uiState.mode==='class' ? renderClassPicker() : renderTeacherPicker();
    var scheduleHtml = uiState.mode==='class' ? renderClassSchedule() : renderTeacherSchedule();
    app.innerHTML =
      '<header class="page-head">'+
        '<div class="eyebrow">普台高級中學　115 學年度第一學期</div>'+
        '<h1>課表查詢系統</h1>'+
        '<p>資料版本：'+esc(META.scheduleVersion||'')+'（'+esc(META.updatedAt||'')+' 更新）　'+esc(META.implementDateRange||'')+'</p>'+
      '</header>'+
      '<div class="card stack">'+
        renderModeSwitch()+
        pickerHtml+
      '</div>'+
      scheduleHtml+
      '<div class="footnote">'+
        '<p>資料來源：'+esc(META.sourceNote||'')+'。課表節次裡的老師姓名／班級代碼帶底線的可以點擊直接跳轉查詢。</p>'+
        '<p>「非淨空週」「淨空週」是學校隔週輪替的課表型態：非淨空週為一般整週（週一～週日皆排課），淨空週週五提早放學、週六日無課。</p>'+
        '<p>班級代碼如 <code>10MA1</code>、<code>9EA2</code> 等為分組教學／能力分組代碼（數字為美式年級編號：7=國一、8=國二、9=國三、10=高一、11=高二、12=高三）；這類分組教學的學生可能來自不同班級，課表上顯示的代碼不代表學生原本的班級。</p>'+
        '<p>本系統僅供課表查詢，不提供課表異動或調代課功能。如發現課表資料有誤，請與教務處聯繫確認。</p>'+
      '</div>';
    bindEvents();
  }

  function bindEvents(){
    document.querySelectorAll('[data-action]').forEach(function(el){
      el.onclick = function(){
        var action = el.getAttribute('data-action');
        if(action==='set-mode'){
          uiState.mode = el.getAttribute('data-mode');
          render();
        } else if(action==='class-group-filter'){
          uiState.classGroupFilter = el.getAttribute('data-val')||'';
          render();
        } else if(action==='teacher-category-filter'){
          uiState.teacherCategoryFilter = el.getAttribute('data-val')||'';
          render();
        } else if(action==='goto-teacher'){
          uiState.mode='teacher'; uiState.teacherName = el.getAttribute('data-name');
          render(); window.scrollTo({top:0, behavior:'smooth'});
        } else if(action==='goto-class'){
          uiState.mode='class'; uiState.className = el.getAttribute('data-name');
          render(); window.scrollTo({top:0, behavior:'smooth'});
        }
      };
    });
    var classSel = document.getElementById('class-select');
    if(classSel) classSel.onchange = function(){ uiState.className = classSel.value || null; render(); };
    var teacherSel = document.getElementById('teacher-select');
    if(teacherSel) teacherSel.onchange = function(){ uiState.teacherName = teacherSel.value || null; render(); };
  }

  render();
})();
</script>
</body>
</html>
